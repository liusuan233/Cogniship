[project]
name = "cogniship"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "liusuan233", email = "3145849381@qq.com" }
]
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
